<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Intervals.icu</title>
<style>
:root{--bg:#E9F1FA;--card:#fff;--tx:#0F1D33;--tx2:#556379;--bd:#CFDDEE;--navy:#172A52;--acc:#2563EB;--ok:#12936A;--warn:#A16207;--err:#D83F4F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:4px 0 6px}
.sub{color:var(--tx2);font-size:13px;margin:0 0 16px}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:14px}
label{display:block;font-size:12px;color:var(--tx2);margin:10px 0 4px}
input{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;font-size:16px;background:#EDF3FB;color:var(--tx)}
button{width:100%;margin-top:14px;padding:12px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:16px;font-weight:600}
button:disabled{opacity:.5}
button.sec{background:var(--navy)}
.r{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px;border-left:5px solid var(--bd)}
.r b{display:block;font-size:14px}
.r span{display:block;font-size:13px;color:var(--tx2);white-space:pre-wrap;word-break:break-word}
.r.ok{border-left-color:var(--ok)}.r.warn{border-left-color:var(--warn)}.r.err{border-left-color:var(--err)}
.sum{background:var(--navy);color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:14px;font-size:14px;white-space:pre-wrap}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
td,th{padding:3px 4px;text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--tx2);font-weight:500}
</style>
</head>
<body>
<main>
<h1>Test Intervals.icu</h1>
<p class="sub">Verifica se l’app può leggere attività, lap, sonno e HRV. La chiave resta in questa pagina e va solo a intervals.icu: non viene salvata né inclusa nel report.</p>

<div class="card">
  <label for="aid">ID atleta (come i123456; vuoto = account della chiave)</label>
  <input id="aid" placeholder="i123456" autocomplete="off" autocapitalize="off">
  <label for="key">Chiave API</label>
  <input id="key" type="password" autocomplete="off">
  <label for="days">Giorni da leggere</label>
  <input id="days" type="number" value="14" min="3" max="60">
  <button id="go">Avvia test</button>
</div>

<div id="sum"></div>
<div id="out"></div>
<button id="copy" class="sec" hidden>Copia report da incollare a Claude</button>
</main>

<script>
(function(){
  var BASE='https://intervals.icu/api/v1';
  var KEY='',AID='0',DAYS=14,rep=[];
  var $=function(i){return document.getElementById(i);};
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function row(st,title,detail,html){
    var d=document.createElement('div');d.className='r '+st;
    d.innerHTML='<b>'+esc(title)+'</b><span>'+esc(detail||'')+'</span>'+(html||'');
    $('out').appendChild(d);
    rep.push((st==='ok'?'[OK] ':st==='warn'?'[ATTENZIONE] ':'[ERRORE] ')+title+(detail?': '+detail:''));
  }
  function ymd(d){var m=d.getMonth()+1,g=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(g<10?'0':'')+g;}
  function dec(n,k){return Number(n).toLocaleString('it-IT',{minimumFractionDigits:k,maximumFractionDigits:k});}
  function hms(s){s=Math.round(s);var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+':'+(m<10?'0':'')+m+':'+(x<10?'0':'')+x:m+':'+(x<10?'0':'')+x;}
  function hm(s){var h=Math.floor(s/3600),m=Math.round(s%3600/60);if(m===60){h++;m=0;}return h+':'+(m<10?'0':'')+m;}
  function pace(sec,m){if(!sec||!m)return '-';var p=sec/(m/1000),mm=Math.floor(p/60),ss=Math.round(p%60);if(ss===60){mm++;ss=0;}return mm+':'+(ss<10?'0':'')+ss+'/km';}
  async function api(path){
    var r=await fetch(BASE+path,{headers:{'Authorization':'Basic '+btoa('API_KEY:'+KEY)}});
    var txt=await r.text(),data=null;try{data=JSON.parse(txt);}catch(e){}
    return {status:r.status,ok:r.ok,data:data,txt:txt};
  }
  function nonNull(o){return Object.keys(o||{}).filter(function(k){return o[k]!==null&&o[k]!==undefined&&o[k]!=='';});}

  async function run(){
    $('out').innerHTML='';$('sum').innerHTML='';$('copy').hidden=true;rep=[];
    KEY=$('key').value.trim();AID=$('aid').value.trim()||'0';DAYS=Math.max(3,Math.min(60,parseInt($('days').value,10)||14));
    if(!KEY){row('err','Manca la chiave API','Inseriscila e riprova.');return;}
    rep.push('Pagina di test servita da: '+location.origin);
    var res={cors:null,auth:true,act:null,laps:null,well:null};
    var today=new Date(),old=new Date(today.getTime()-DAYS*864e5);
    var oldest=ymd(old),newest=ymd(today);

    // 1. raggiungibilità + CORS + autenticazione
    var reach=false;
    try{await fetch('https://intervals.icu/',{mode:'no-cors'});reach=true;}catch(e){}
    try{
      var a=await api('/athlete/'+encodeURIComponent(AID));
      if(a.ok){
        res.cors=true;
        row('ok','Connessione e autenticazione','La chiamata dal browser funziona (nessun blocco CORS). Atleta: '+((a.data&&(a.data.name||a.data.firstname))||'ok')+(a.data&&a.data.id?' ('+a.data.id+')':''));
      }else if(a.status===401||a.status===403){
        res.cors=true;res.auth=false;
        row('err','Chiave o ID non accettati','HTTP '+a.status+'. La chiamata arriva ma le credenziali non vanno: controlla chiave e ID atleta (formato i123456).');
        finish(res);return;
      }else{
        res.cors=true;
        row('warn','Risposta inattesa dal profilo atleta','HTTP '+a.status+': '+a.txt.slice(0,120));
      }
    }catch(e){
      res.cors=false;
      row('err',reach?'Bloccata dal browser (probabile CORS)':'Rete non raggiungibile','Il sito risponde ('+(reach?'sì':'no')+') ma la chiamata con chiave è fallita: '+e.message+'. '+(reach?'Serve un piccolo proxy personale (per esempio un Cloudflare Worker).':'Controlla la connessione e riprova.'));
      finish(res);return;
    }

    // 2. attività
    var runs=[];
    try{
      var r=await api('/athlete/'+encodeURIComponent(AID)+'/activities?oldest='+oldest+'&newest='+newest);
      if(!r.ok||!Array.isArray(r.data)){row('err','Attività','HTTP '+r.status+': '+r.txt.slice(0,120));}
      else{
        var all=r.data;
        runs=all.filter(function(x){return /run/i.test(x.type||'');}).sort(function(p,q){return String(q.start_date_local).localeCompare(String(p.start_date_local));});
        res.act=all.length>0;
        var want=['distance','moving_time','average_heartrate','max_heartrate','average_cadence','average_speed','total_elevation_gain','icu_training_load','icu_rpe','feel','calories'];
        var present=want.filter(function(k){return runs.some(function(x){return x[k]!==null&&x[k]!==undefined;});});
        var missing=want.filter(function(k){return present.indexOf(k)<0;});
        var tbl='<table><tr><th>Data</th><th>km</th><th>Passo</th><th>FC</th></tr>'+runs.slice(0,5).map(function(x){
          return '<tr><td>'+esc(String(x.start_date_local||'').slice(0,10))+'</td><td>'+(x.distance?dec(x.distance/1000,2):'-')+'</td><td>'+pace(x.moving_time,x.distance)+'</td><td>'+(x.average_heartrate?Math.round(x.average_heartrate):'-')+'</td></tr>';
        }).join('')+'</table>';
        row(all.length?(runs.length?'ok':'warn'):'warn','Attività negli ultimi '+DAYS+' giorni',all.length+' attività, di cui '+runs.length+' di corsa.\nCampi presenti nelle corse: '+(present.join(', ')||'nessuno')+'.\nCampi assenti: '+(missing.join(', ')||'nessuno')+'.',runs.length?tbl:'');
        if(!all.length)rep.push('Nessuna attività trovata: Garmin è collegato e le attività sono state scaricate?');
      }
    }catch(e){row('err','Attività',e.message);}

    // 3. lap / intervalli dell'ultima corsa
    try{
      if(!runs.length){row('warn','Lap e intervalli','Nessuna corsa nel periodo: non posso verificare.');}
      else{
        var last=runs[0];
        var l=await api('/activity/'+encodeURIComponent(last.id)+'/intervals');
        if(!l.ok||!l.data){row('warn','Lap e intervalli','HTTP '+l.status+' sull’ultima corsa ('+String(last.start_date_local||'').slice(0,10)+'): '+l.txt.slice(0,120));}
        else{
          var iv=l.data.icu_intervals||[];
          res.laps=iv.length>0;
          var keys={};iv.forEach(function(x){nonNull(x).forEach(function(k){keys[k]=(keys[k]||0)+1;});});
          var lt='<table><tr><th>#</th><th>Tipo</th><th>km</th><th>Passo</th><th>FC</th></tr>'+iv.slice(0,8).map(function(x,i){
            return '<tr><td>'+(i+1)+'</td><td>'+esc(x.type||x.label||'-')+'</td><td>'+(x.distance?dec(x.distance/1000,2):'-')+'</td><td>'+pace(x.moving_time||x.elapsed_time,x.distance)+'</td><td>'+(x.average_heartrate?Math.round(x.average_heartrate):'-')+'</td></tr>';
          }).join('')+'</table>';
          row(iv.length?'ok':'warn','Lap e intervalli (ultima corsa)',iv.length+' intervalli.\nCampi disponibili: '+(Object.keys(keys).join(', ')||'nessuno')+'.\nDinamiche di corsa (contatto al suolo, oscillazione verticale) da cercare tra i campi: servono per le schede lap dell’app.',iv.length?lt:'');
        }
      }
    }catch(e){row('err','Lap e intervalli',e.message);}

    // 4. benessere
    try{
      var w=await api('/athlete/'+encodeURIComponent(AID)+'/wellness?oldest='+oldest+'&newest='+newest);
      if(!w.ok||!Array.isArray(w.data)){row('err','Benessere (sonno, HRV)','HTTP '+w.status+': '+w.txt.slice(0,120));}
      else{
        var days=w.data,cnt={};
        days.forEach(function(d){nonNull(d).forEach(function(k){if(k!=='id'&&k!=='updated')cnt[k]=(cnt[k]||0)+1;});});
        var main=['sleepSecs','sleepScore','restingHR','hrv','hrvSDNN','readiness','weight','steps','stress'];
        var have=main.filter(function(k){return cnt[k];}).map(function(k){return k+' ('+cnt[k]+'/'+days.length+')';});
        var lack=main.filter(function(k){return !cnt[k];});
        var others=Object.keys(cnt).filter(function(k){return main.indexOf(k)<0;});
        res.well={sleep:!!cnt.sleepSecs,hrv:!!cnt.hrv||!!cnt.hrvSDNN,rhr:!!cnt.restingHR,n:days.length};
        var wt='<table><tr><th>Giorno</th><th>Sonno</th><th>Score</th><th>FC rip.</th><th>HRV</th></tr>'+days.slice(-7).reverse().map(function(d){
          return '<tr><td>'+esc(String(d.id||'').slice(5))+'</td><td>'+(d.sleepSecs?hm(d.sleepSecs):'-')+'</td><td>'+(d.sleepScore!=null?Math.round(d.sleepScore):'-')+'</td><td>'+(d.restingHR!=null?d.restingHR:'-')+'</td><td>'+(d.hrv!=null?dec(d.hrv,1):'-')+'</td></tr>';
        }).join('')+'</table>';
        var skip=['id','updated','ctl','atl','rampRate','ctlLoad','atlLoad','sportInfo','tempWeight'];
        var dl=days.slice(-10).map(function(d){var ks=nonNull(d).filter(function(k){return skip.indexOf(k)<0;});return String(d.id||'?')+': '+(ks.length?ks.map(function(k){var v=d[k];return k+'='+(v&&typeof v==='object'?'{...}':v);}).join(', '):'nessun dato');}).join('\n');
        row(days.length?(cnt.sleepSecs&&(cnt.hrv||cnt.hrvSDNN)?'ok':'warn'):'warn','Benessere (sonno, HRV, FC a riposo)',days.length+' giorni con dati.\nPopolati: '+(have.join(', ')||'nessuno')+'.\nAssenti: '+(lack.join(', ')||'nessuno')+'.'+(others.length?'\nAltri campi: '+others.join(', ')+'.':'')+'\nUltimi giorni, campi con valore:\n'+dl,days.length?wt:'');
        if(!days.length)rep.push('Nessun dato di benessere: nella scheda Garmin di Intervals.icu è attiva la sincronizzazione dei dati di benessere (e il download dello storico)?');
      }
    }catch(e){row('err','Benessere (sonno, HRV)',e.message);}

    // 5. metriche già calcolate da Intervals: campi dell'ultima corsa, zone degli intervalli, soglie, migliori sforzi
    try{
      if(runs.length){
        var la=await api('/activity/'+encodeURIComponent(runs[0].id));
        if(la.ok&&la.data){
          var ks=nonNull(la.data).filter(function(k){return /^icu_|pace|speed|decoupl|efficien|trimp|load|intens|zone|threshold|lthr|gap/i.test(k);});
          row('ok','Campi calcolati da Intervals (ultima corsa)',ks.map(function(k){var v=la.data[k];return k+(v!==null&&typeof v!=='object'?'='+(typeof v==='number'?Math.round(v*100)/100:String(v).slice(0,20)):'');}).join(', ')||'nessuno');
        }else row('warn','Campi calcolati (ultima corsa)','HTTP '+la.status);
      }
    }catch(e){row('warn','Campi calcolati (ultima corsa)',e.message);}
    try{
      var lines=[];
      for(var q=0;q<Math.min(3,runs.length);q++){
        var iv=await api('/activity/'+encodeURIComponent(runs[q].id)+'/intervals');
        var arr=(iv.ok&&iv.data&&iv.data.icu_intervals)||[];
        lines.push(String(runs[q].start_date_local||'').slice(0,10)+' · '+(runs[q].name||'')+' ('+arr.length+' intervalli)');
        arr.slice(0,20).forEach(function(x,i){lines.push('  '+(i+1)+' '+(x.type||'-')+' | intensità '+(x.intensity!=null?x.intensity:'-')+' | zona '+(x.zone!=null?x.zone:'-')+' | '+(x.distance?dec(x.distance/1000,2):'-')+' km | '+pace(x.moving_time||x.elapsed_time,x.distance));});
      }
      row(lines.length?'ok':'warn','Come Intervals classifica gli intervalli (ultime 3 corse)',lines.join('\n')||'nessuna corsa');
    }catch(e){row('warn','Classificazione intervalli',e.message);}
    try{
      var ss=await api('/athlete/'+encodeURIComponent(AID)+'/sport-settings');
      var list=ss.ok&&Array.isArray(ss.data)?ss.data:null;
      if(!list){var ap=await api('/athlete/'+encodeURIComponent(AID));list=ap.ok&&ap.data&&Array.isArray(ap.data.sportSettings)?ap.data.sportSettings:null;}
      var run=list&&list.filter(function(x){return (x.types||[]).some(function(t){return /run/i.test(t);});})[0];
      if(run){
        var keys=nonNull(run).filter(function(k){return /thresh|lthr|max_hr|pace|zone|hr/i.test(k);});
        row('ok','Impostazioni corsa su Intervals (soglie e zone)',keys.map(function(k){var v=run[k];return k+'='+(Array.isArray(v)?'['+v.slice(0,8).join(', ')+(v.length>8?', ...':'')+']':(typeof v==='object'?'{...}':v));}).join('\n'));
      }else row('warn','Impostazioni corsa su Intervals','non trovate (HTTP '+ss.status+')');
    }catch(e){row('warn','Impostazioni corsa su Intervals',e.message);}
    try{
      var pc=await api('/athlete/'+encodeURIComponent(AID)+'/pace-curves?type=Run&curves=84d');
      if(!pc.ok||!pc.data||!Array.isArray(pc.data.list)||!pc.data.list.length){row('warn','Migliori sforzi (pace curve)','HTTP '+pc.status+': '+String(pc.txt).slice(0,120));}
      else{
        var cv=pc.data.list[0],dist=cv.distance||[];
        var arrKeys=Object.keys(cv).filter(function(k){return Array.isArray(cv[k])&&cv[k].length===dist.length&&k!=='distance';});
        var out=['Campi: '+Object.keys(cv).map(function(k){return k+(Array.isArray(cv[k])?'['+cv[k].length+']':'');}).join(', ')];
        [1000,1500,3000,5000,10000].forEach(function(m){
          var i=dist.findIndex(function(x){return Math.abs(x-m)<1;});
          if(i<0){out.push(m+' m: non presente');return;}
          out.push(m+' m: '+arrKeys.map(function(k){var v=cv[k][i];return k+'='+(typeof v==='number'?Math.round(v*100)/100:v);}).join(', '));
        });
        if(cv.paceModels&&cv.paceModels.length)out.push('paceModels[0]: '+JSON.stringify(cv.paceModels[0]).slice(0,900));
        row('ok','Migliori sforzi (ultimi 84 giorni)',out.join('\n'));
      }
    }catch(e){row('warn','Migliori sforzi (pace curve)',e.message);}

    finish(res);
  }

  function finish(res){
    var L=[];
    L.push('Chiamate dal browser: '+(res.cors===true?'raggiungibile (nessun blocco CORS)':res.cors===false?'BLOCCATE (serve proxy)':'non verificate'));
    if(res.cors===true&&!res.auth){L.push('Credenziali rifiutate: controlla chiave e ID atleta, poi riprova.');}
    else if(res.cors===true){
      L.push('Attività di corsa: '+(res.act?'OK':'nessun dato'));
      L.push('Lap/intervalli: '+(res.laps?'OK':res.laps===false?'vuoti':'non verificati'));
      L.push('Sonno: '+(res.well?(res.well.sleep?'OK':'assente'):'non verificato')+' · HRV: '+(res.well?(res.well.hrv?'OK':'assente'):'non verificato')+' · FC a riposo: '+(res.well?(res.well.rhr?'OK':'assente'):'non verificata'));
    }
    $('sum').className='sum';$('sum').textContent=L.join('\n');
    rep.unshift('RIEPILOGO\n'+L.join('\n')+'\n\nDETTAGLIO');
    $('copy').hidden=false;
  }

  $('go').addEventListener('click',async function(){
    var b=$('go');b.disabled=true;b.textContent='Test in corso...';
    try{await run();}catch(e){row('err','Errore imprevisto',e.message);}
    b.disabled=false;b.textContent='Avvia test';
  });
  $('copy').addEventListener('click',function(){
    var t=rep.join('\n');
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){$('copy').textContent='Copiato';setTimeout(function(){$('copy').textContent='Copia report da incollare a Claude';},1800);},function(){window.prompt('Copia il report:',t);});
    }else{window.prompt('Copia il report:',t);}
  });
})();
</script>
</body>
</html>
